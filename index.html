<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Particle Life (WebGPU)</title>
    <link rel="icon" href="data:,">
    <script>
        // スマホ / タブレットは WebGPU の対応が不完全なので常にスマホ版へ (?desktop で PC 版を強制)
        (function () {
            var ua = navigator.userAgent;
            var mobile = /Android|iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            if (mobile && !/[?&]desktop\b/.test(location.search)) location.replace('mobile.html' + location.search);
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="canvas"></canvas>
    <script type="module" src="src/main.js"></script>
</body>

</html>
